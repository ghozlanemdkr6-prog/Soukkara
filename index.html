<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حلويات أم أمين العاصمية - سكرة</title>
  <!-- Tailwind CSS للتصميم والألوان الجميلة -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #fbf9f5; }
  </style>
  <!-- React & Babel لتشغيل الواجهة الحية مباشرة بالمتصفح -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="text-stone-800 antialiased pb-20">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [activeCategory, setActiveCategory] = useState("الكل");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [orderModalOpen, setOrderModalOpen] = useState(false);
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [deliveryDate, setDeliveryDate] = useState('');
      const [customText, setCustomText] = useState('');
      const [orderSuccess, setOrderSuccess] = useState(null);

      const store = {
        name: "حلويات أم أمين العاصمية",
        bio: "أصالة الحلويات العاصمية والجزائرية التقليدية والعصرية باللوز الصافي وعسل طبيعي ولمسة إتقان لأفراحكم ومناسباتكم.",
        wilaya: "الجزائر العاصمة (القبة)",
        phone: "0555001122",
        rating: "4.9 (184 تقييم)"
      };

      const products = [
        {
          id: "prod-1",
          title: "مقروط اللوز الملكي بالليمون",
          category: "حلويات الأعراس",
          price: 2800,
          unit: "د.ج / كلغ",
          description: "لوز حر مطحون ناعم مع نكهة قشور الليمون الطبيعي وماء زهر المقطر، مغلف بالسكر الناعم الفاخر بدون أي إضافات صناعية.",
          image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&auto=format&fit=crop"
        },
        {
          id: "prod-2",
          title: "تشاراك العريان باللوز المنكه",
          category: "مقروط وكعيكعات",
          price: 2400,
          unit: "د.ج / كلغ",
          description: "عجينة هشة تذوب في الفم محشوة بقلب من اللوز المعسل بماء الورد المقطر، ومرشوشة بشرائح اللوز المقرمش.",
          image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600&auto=format&fit=crop"
        },
        {
          id: "prod-3",
          title: "كعيكعات بريستيج مطلية ومزينة",
          category: "حلويات الأعراس",
          price: 250,
          unit: "د.ج / حبة",
          description: "طلاء ناعم متقن بلون وردي عاجي، محشوة بعقدة اللوز الطرية ومزينة بزهور السكر اليدوية ولمسات راقية.",
          image: "https://images.unsplash.com/photo-1535141192574-5d4897c13136?w=600&auto=format&fit=crop"
        },
        {
          id: "prod-4",
          title: "تارت عيد ميلاد وأفراح مخصصة",
          category: "تارت وكيك",
          price: 4500,
          unit: "د.ج / قالب",
          description: "كعكة إسفنج خفيفة بحشوة جاناش الشوكولاطة البلجيكية، الفراولة الطازجة، وتزيين مخصص بالاسم حسب ذوقكم.",
          image: "https://images.unsplash.com/photo-1588195538326-c5b1e9f80a1b?w=600&auto=format&fit=crop"
        }
      ];

      const categories = ["الكل", "حلويات الأعراس", "مقروط وكعيكعات", "تارت وكيك"];
      const filtered = activeCategory === "الكل" ? products : products.filter(p => p.category === activeCategory);

      const handleOpenOrder = (prod) => {
        setSelectedProduct(prod);
        setOrderModalOpen(true);
      };

      const handleConfirmOrder = (e) => {
        e.preventDefault();
        const orderNum = `ALG-${Math.floor(1000 + Math.random() * 9000)}`;
        const deposit = Math.round(selectedProduct.price * 0.3);
        setOrderSuccess({ orderNum, deposit });
      };

      const openWhatsApp = () => {
        const msg = encodeURIComponent(`سلام عليكم أم أمين، نطلب حجز:\n*${selectedProduct?.title}*\nرقم الطلبية: ${orderSuccess?.orderNum}\nالاسم: ${customerName}\nالهاتف: ${customerPhone}\nالموعد: ${deliveryDate}\nالكتابة: ${customText || 'بدون'}`);
        window.open(`https://wa.me/213${store.phone}?text=${msg}`, '_blank');
      };

      return (
        <div className="max-w-md mx-auto min-h-screen px-4 pt-6">
          {/* رأس المتجر */}
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-stone-100 mb-5 text-center relative overflow-hidden">
            <div className="w-20 h-20 mx-auto rounded-full bg-[#9e4a28]/10 text-3xl flex items-center justify-center mb-3">
              👩‍🍳
            </div>
            <h1 className="text-xl font-bold text-stone-900">{store.name}</h1>
            <div className="flex items-center justify-center gap-2 text-xs text-stone-500 mt-1">
              <span>📍 {store.wilaya}</span>
              <span>•</span>
              <span className="text-[#9e4a28] font-bold">★ {store.rating}</span>
            </div>
            <p className="text-xs text-stone-600 mt-3 leading-relaxed">{store.bio}</p>
          </div>

          {/* تبويبات الأقسام */}
          <div className="flex gap-2 overflow-x-auto pb-3 scrollbar-none mb-4">
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setActiveCategory(cat)}
                className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                  activeCategory === cat ? 'bg-[#9e4a28] text-white shadow-md' : 'bg-white text-stone-600 border border-stone-200'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* قائمة الحلويات */}
          <div className="space-y-4">
            {filtered.map(item => (
              <div key={item.id} className="bg-white rounded-2xl p-4 shadow-sm border border-stone-100 flex gap-3.5 items-center">
                <img src={item.image} alt={item.title} className="w-24 h-24 rounded-xl object-cover shrink-0" />
                <div className="flex-1 min-w-0">
                  <span className="text-[10px] font-bold text-[#9e4a28] bg-[#9e4a28]/10 px-2 py-0.5 rounded-full inline-block mb-1">
                    {item.category}
                  </span>
                  <h3 className="font-bold text-stone-900 text-sm truncate">{item.title}</h3>
                  <p className="text-stone-500 text-[11px] line-clamp-2 mt-0.5">{item.description}</p>
                  <div className="flex items-center justify-between mt-2.5">
                    <span className="font-bold text-xs text-[#9e4a28]">{item.price.toLocaleString()} {item.unit}</span>
                    <button
                      onClick={() => handleOpenOrder(item)}
                      className="bg-[#9e4a28] text-white text-xs px-3.5 py-1.5 rounded-lg font-bold shadow-sm hover:bg-[#833a1e] transition-all"
                    >
                      طلب ✍️
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* نافذة إتمام الطلب */}
          {orderModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
                {!orderSuccess ? (
                  <form onSubmit={handleConfirmOrder} className="space-y-4">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h3 className="font-bold text-stone-900">طلب: {selectedProduct?.title}</h3>
                      <button type="button" onClick={() => setOrderModalOpen(false)} className="text-stone-400 text-lg font-bold">✕</button>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-stone-700 block mb-1">الاسم واللقب *</label>
                      <input required type="text" value={customerName} onChange={e => setCustomerName(e.target.value)} placeholder="مثال: ياسمين بلقاسم" className="w-full text-xs p-3 rounded-xl border border-stone-200 outline-none focus:border-[#9e4a28]" />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-stone-700 block mb-1">رقم الهاتف *</label>
                      <input required type="tel" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} placeholder="05 / 06 / 07 XX XX XX XX" className="w-full text-xs p-3 rounded-xl border border-stone-200 outline-none focus:border-[#9e4a28]" />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-stone-700 block mb-1">تاريخ استلام الطلبية *</label>
                      <input required type="date" value={deliveryDate} onChange={e => setDeliveryDate(e.target.value)} className="w-full text-xs p-3 rounded-xl border border-stone-200 outline-none focus:border-[#9e4a28]" />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-stone-700 block mb-1">كتابة مخصصة على الحلوى (اختياري)</label>
                      <input type="text" value={customText} onChange={e => setCustomText(e.target.value)} placeholder="مثال: ألف مبروك للعروسين 💍" className="w-full text-xs p-3 rounded-xl border border-stone-200 outline-none focus:border-[#9e4a28]" />
                    </div>

                    <div className="bg-[#9e4a28]/10 p-3 rounded-xl text-xs flex justify-between items-center text-[#9e4a28] font-bold">
                      <span>العربون المطلوب (30%):</span>
                      <span>{Math.round(selectedProduct?.price * 0.3).toLocaleString()} د.ج</span>
                    </div>

                    <button type="submit" className="w-full bg-[#9e4a28] text-white py-3 rounded-xl text-xs font-bold shadow-md">
                      تأكيد الحجز وتثبيت الطلب ✓
                    </button>
                  </form>
                ) : (
                  <div className="text-center py-6 space-y-4">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto">✓</div>
                    <h4 className="text-base font-bold text-stone-900">تم تسجيل طلبيتك بنجاح!</h4>
                    <p className="text-xs text-stone-500">رقم الطلبية: <span className="font-bold text-[#9e4a28]">{orderSuccess.orderNum}</span></p>
                    <p className="text-xs text-stone-600">لتثبيت الحجز، يرجى إرسال التفاصيل مباشرة عبر واتساب لتأكيد العربون ({orderSuccess.deposit.toLocaleString()} د.ج).</p>
                    <button onClick={openWhatsApp} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-xs font-bold shadow-md flex items-center justify-center gap-2">
                      💬 إرسال الطلب للبائعة عبر واتساب
                    </button>
                    <button onClick={() => { setOrderModalOpen(false); setOrderSuccess(null); }} className="w-full bg-stone-100 text-stone-600 py-2.5 rounded-xl text-xs font-bold">
                      إغلاق
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
